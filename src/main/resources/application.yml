spring:
  application:
    name: neuroscape
  datasource:
    url: jdbc:h2:file:${NEUROSCAPE_DATA_DIR:./data}/neuroscape;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info

neuroscape:
  grid-resolution: 48
  tick-millis: 60
  epochs-per-tick: 2
  max-sessions: 64
  session-idle-timeout: 30m
  sse-timeout: 30m
  max-history: 600
